
name: Verify iOS Project

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f Makefile
          test -f Info.plist
          test -f main.m
          plutil -lint Info.plist

      - name: Package source
        run: |
          zip -r project-source.zip \
            Makefile Info.plist main.m \
            entitlements.plist README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-source
          path: project-source.zip
